name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate terminal JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path("app/terminal/web/terminal.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", src, flags=re.S | re.I)
          Path("/tmp/sshdock-terminal.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/sshdock-terminal.js

      - name: Compile sources
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest -q
