<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#080d13" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #080d13 !important; color: #e6edf3;
      overflow: hidden; color-scheme: dark;
    }
    #term-root, #terminal {
      height: 100%; width: 100%;
      box-sizing: border-box;
    }
    #terminal {
      padding: 4px 16px 4px 4px;
      position: relative;
      box-sizing: border-box;
    }
    .xterm { height: 100%; }
    /* Reserve a real right-side gutter for the native PySide6 scrollbar. */
    #terminal {
      padding-right: 18px;
    }
    .xterm {
      height: 100%;
      width: 100%;
    }
    .xterm .xterm-viewport {
      overflow-y: scroll !important;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /*
     * Magic Docker table — plan:
     *  1) Shell prints 20 blank lines then PS1.
     *  2) We place one HTML block per table, height = 20 * cellHeight.
     *  3) top = (startAbs - viewportY) * cellHeight  → moves with shell scroll.
     *  4) .body { overflow:auto } → table has its own scrollbar.
     *  5) Wheel on .body does not scroll the shell (stopPropagation) when table can scroll.
     *  6) Right padding so table scrollbar sits clear of xterm viewport scrollbar.
     *  7) Up to ~20 data rows fit without internal scrollbar when content is short.
     *  8) Column headers are drag-resizable (col-resize cursor on right edge).
     */
    .sshdock-tbl {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background: #0c1219;
      border: 1px solid #2a3440;
      border-radius: 3px;
      overflow: hidden;
      font-family: Cascadia Mono, Consolas, Menlo, monospace;
      font-size: 12px;
      color: #e6edf3;
      pointer-events: auto;
      margin-right: 0;
    }
    .sshdock-tbl .cap {
      flex: 0 0 auto;
      padding: 2px 8px;
      font-size: 11px;
      color: #8b949e;
      background: #0e141c;
      border-bottom: 1px solid #1e2630;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sshdock-tbl .body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;           /* own scrollbar */
      overscroll-behavior: contain;
      /* Inset so body scrollbar stays inside the block and clear of shell scrollbar */
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: #3d4a5c #0c1219;
    }
    .sshdock-tbl .body::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .sshdock-tbl .body::-webkit-scrollbar-track {
      background: #0c1219;
    }
    .sshdock-tbl .body::-webkit-scrollbar-thumb {
      background: #3d4a5c;
      border-radius: 4px;
    }
    .sshdock-tbl .body::-webkit-scrollbar-thumb:hover {
      background: #526078;
    }
    .sshdock-tbl table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 100%;
      table-layout: fixed;
    }
    .sshdock-tbl th,
    .sshdock-tbl td { overflow: hidden; text-overflow: ellipsis; }
    .sshdock-tbl td { cursor: default; user-select: text; }
    .sshdock-copy-menu { position: fixed; z-index: 5000; min-width: 150px; padding: 4px; border: 1px solid #2a3440; border-radius: 5px; background: #111821; box-shadow: 0 8px 24px rgba(0,0,0,.34); font: 12px Cascadia Mono, Consolas, Menlo, monospace; }
    .sshdock-copy-menu button { display:block; width:100%; border:0; border-radius:3px; padding:7px 10px; text-align:left; background:transparent; color:#e6edf3; cursor:pointer; }
    .sshdock-copy-menu button:hover { background:#1a2633; }
    .sshdock-tbl thead th {
      position: sticky;
      top: 0;
      background: #141b24;
      color: #7cb7ff;
      font-weight: 600;
      text-align: left;
      padding: 2px 8px;
      border-bottom: 1px solid #2a3440;
      border-right: 1px solid #1a222c;
      white-space: nowrap;
      min-width: 48px;
      cursor: default;
      user-select: none;
    }
    .sshdock-tbl thead th:hover {
      background: #1a2430;
    }
    .sshdock-tbl tbody td {
      padding: 2px 8px;
      border-bottom: 1px solid #121820;
      border-right: 1px solid #121820;
      white-space: nowrap;
    }
    .sshdock-tbl .col-id {
      min-width: 52ch !important;
      width: max-content !important;
      max-width: none !important;
    }
    .sshdock-tbl tbody tr:nth-child(even) { background: rgba(18,24,32,0.65); }
    .sshdock-tbl tbody tr:hover { background: #152032; }
    .sshdock-tbl td.st-up { color: #3fb950; }
    .sshdock-tbl td.st-down { color: #f85149; }
    .sshdock-tbl td.st-warn { color: #d29922; }

    /* Predictive command ghost text. It is an overlay, never terminal content. */
    #sshdock-ghost {
      position: absolute;
      z-index: 70;
      pointer-events: none;
      white-space: pre;
      font-family: Cascadia Mono, Consolas, Menlo, monospace;
      font-size: 13px;
      line-height: 1.2;
      color: rgba(148, 163, 184, 0.72);
      font-style: normal;
      letter-spacing: 0;
      opacity: 0;
      transition: opacity 60ms linear;
      overflow: hidden;
      max-width: calc(100% - 26px);
    }
    #sshdock-ghost.visible {
      opacity: 0.78;
      text-shadow: 0 0 9px rgba(111, 182, 255, 0.18);
      transition: opacity 80ms ease, transform 80ms ease;
    }
    #sshdock-ghost.visible.ai-learning {
      animation: sshdock-ai-breathe 1.8s ease-in-out infinite;
    }
    @keyframes sshdock-ai-breathe {
      0%, 100% { opacity: 0.64; }
      50% { opacity: 0.84; }
    }
    #sshdock-ghost .ghost-gap { display:inline-block; height:1em; vertical-align:top; }
    #sshdock-ghost.light { color: rgba(71, 85, 105, 0.68); }

    /* Explicit command palette for Ctrl+Space; it is independent of shell output. */
    #sshdock-suggestions {
      position: absolute; z-index: 80; display: none; box-sizing: border-box;
      width: 420px; max-width: calc(100% - 24px); overflow: hidden;
      color: #e6edf3; background: rgba(12, 18, 27, 0.98);
      border: 1px solid #344255; border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
      font-family: Cascadia Mono, Consolas, Menlo, monospace;
      font-size: 12px; line-height: 1.4; pointer-events: auto;
    }
    #sshdock-suggestions.visible { display: block; }
    #sshdock-suggestions .suggestion-heading {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 7px 10px; color: #9aa9bb; background: #131d2a;
      border-bottom: 1px solid #273446;
      font-family: system-ui, sans-serif; font-size: 11px;
      font-weight: 650; letter-spacing: .02em;
    }
    #sshdock-suggestions .suggestion-heading .count { color: #6f839b; font-weight: 500; }
    #sshdock-suggestions .suggestion-row {
      display: flex; align-items: center; gap: 9px; min-width: 0;
      padding: 7px 10px; border-bottom: 1px solid rgba(47, 61, 79, 0.5);
      cursor: pointer;
    }
    #sshdock-suggestions .suggestion-row:last-of-type { border-bottom: 0; }
    #sshdock-suggestions .suggestion-row:hover,
    #sshdock-suggestions .suggestion-row.active { background: #1b3048; }
    #sshdock-suggestions .suggestion-index {
      flex: 0 0 20px; width: 20px; height: 20px; display: inline-flex;
      align-items: center; justify-content: center; box-sizing: border-box;
      color: #9db8d8; background: #1a2635; border: 1px solid #34475e;
      border-radius: 4px; font-size: 10px;
    }
    #sshdock-suggestions .suggestion-meta {
      flex: 0 0 auto; display:flex; align-items:center; gap:6px;
      font-family: system-ui, sans-serif; font-size:10px; color:#7f94ab;
      white-space:nowrap;
    }
    #sshdock-suggestions .suggestion-source {
      padding:2px 5px; border-radius:999px; border:1px solid #34475e;
      background:#121d29; color:#90bce9; text-transform:uppercase; letter-spacing:.04em;
    }
    #sshdock-suggestions .suggestion-confidence {
      min-width:28px; text-align:right; color:#7188a2;
    }
    #sshdock-suggestions .suggestion-command {
      flex: 1 1 auto; min-width: 0; white-space: pre; overflow: hidden;
      text-overflow: ellipsis; color: #e6edf3;
    }
    #sshdock-suggestions .suggestion-row.active .suggestion-command { color: #8ac7ff; }
    #sshdock-suggestions .suggestion-empty {
      padding: 12px; color: #9aa9bb; font-family: system-ui, sans-serif;
    }
    #sshdock-suggestions .suggestion-footer {
      padding: 6px 10px; color: #8494a8; background: #0e151f;
      border-top: 1px solid #273446; font-family: system-ui, sans-serif; font-size: 10px;
    }
    #sshdock-suggestions.light {
      color: #1f2933; background: rgba(255, 255, 255, 0.98);
      border-color: #cbd5e1; box-shadow: 0 12px 30px rgba(30, 41, 59, 0.2);
    }
    #sshdock-suggestions.light .suggestion-heading { color: #526273; background: #f1f5f9; border-color: #dbe3ec; }
    #sshdock-suggestions.light .suggestion-heading .count { color: #748296; }
    #sshdock-suggestions.light .suggestion-row { border-color: #edf1f6; }
    #sshdock-suggestions.light .suggestion-row:hover,
    #sshdock-suggestions.light .suggestion-row.active { background: #eaf2ff; }
    #sshdock-suggestions.light .suggestion-index { color: #3b5f8c; background: #f3f7fc; border-color: #cbd9eb; }
    #sshdock-suggestions.light .suggestion-command { color: #1f2933; }
    #sshdock-suggestions.light .suggestion-row.active .suggestion-command { color: #1759a6; }
    #sshdock-suggestions.light .suggestion-empty { color: #526273; }
    #sshdock-suggestions.light .suggestion-footer { color: #66758a; background: #f8fafc; border-color: #dbe3ec; }

  </style>
</head>
<body>
  <div id="term-root">
    <div id="terminal">
      <div id="sshdock-ghost" aria-hidden="true"></div>
      <div id="sshdock-suggestions" role="listbox" aria-label="Command suggestions"></div>
    </div>
  </div>

<script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/qwebchannel.js"></script>
  <script>
    (function () {
      function resolveTerminal() {
        if (window.Terminal) return window.Terminal;
        if (window.xterm && window.xterm.Terminal) return window.xterm.Terminal;
        return null;
      }
      function resolveFitAddon() {
        if (window.FitAddon && window.FitAddon.FitAddon) return window.FitAddon.FitAddon;
        if (window.FitAddon) return window.FitAddon;
        return null;
      }

      const TerminalCtor = resolveTerminal();
      const FitCtor = resolveFitAddon();
      if (!TerminalCtor) {
        document.body.innerHTML = '<pre style="color:#f88;padding:12px">xterm.js failed to load</pre>';
        return;
      }

      const term = new TerminalCtor({
        cursorBlink: true,
        fontFamily: 'Cascadia Mono, Consolas, Menlo, monospace',
        fontSize: 13,
        lineHeight: 1.2,
        convertEol: true,
        drawBoldTextInBrightColors: true,
        minimumContrastRatio: 1,
        theme: {
          background: '#080d13',
          foreground: '#e6edf3',
          cursor: '#e6edf3',
          selectionBackground: '#264f78',
          black: '#0b0f14',
          red: '#ff5f56',
          green: '#5cff8a',
          yellow: '#ffd866',
          blue: '#5aa9ff',
          magenta: '#d68cff',
          cyan: '#52e8ff',
          white: '#e6edf3',
          brightBlack: '#66727e',
          brightRed: '#ff6b6b',
          brightGreen: '#69f58f',
          brightYellow: '#ffe58a',
          brightBlue: '#78b9ff',
          brightMagenta: '#e7a8ff',
          brightCyan: '#82f1ff',
          brightWhite: '#ffffff'
        },
        allowProposedApi: true,
        scrollback: 5000
      });

      const fitAddon = FitCtor ? new FitCtor() : null;
      if (fitAddon) term.loadAddon(fitAddon);

      const terminalHost = document.getElementById('terminal');
      term.open(terminalHost);

      const ghost = document.getElementById('sshdock-ghost') || document.createElement('div');
      if (!ghost.parentNode) terminalHost.appendChild(ghost);
      const suggestionPopup = document.getElementById('sshdock-suggestions') || document.createElement('div');
      if (!suggestionPopup.parentNode) terminalHost.appendChild(suggestionPopup);
      suggestionPopup.addEventListener('pointerdown', function (ev) { ev.preventDefault(); });

      const completionContext = {
        serverId: '',
        cwd: '/',
        shell: ''
      };
      let terminalAI = {
        shadowEnabled: true,
        suggestionsEnabled: true
      };
      let ghostCandidate = '';
      let ghostSuffix = '';
      let ghostRequestSeq = 0;
      let ghostAnchorX = null;
      let inputModel = '';
      let inputModelKnown = true;
      let suggestionRequestSeq = 0;
      let suggestionRefreshTimer = null;
      let suggestions = [];
      let selectedSuggestion = 0;
      let suggestionsVisible = false;
      let ghostPredictionTimer = null;
      let ghostPositionFramePending = false;
      const GHOST_PREDICTION_DEBOUNCE_MS = 180;
      const SUGGESTION_REFRESH_DEBOUNCE_MS = 180;

      function clearGhostVisual() {
        ghostCandidate = '';
        ghostSuffix = '';
        ghost.classList.remove('visible');
        ghost.classList.remove('ai-learning');
        ghost.textContent = '';
      }

      function hideGhost() {
        if (ghostPredictionTimer !== null) {
          clearTimeout(ghostPredictionTimer);
          ghostPredictionTimer = null;
        }
        ghostRequestSeq += 1;
        clearGhostVisual();
      }

      function hideSuggestions() {
        if (suggestionRefreshTimer !== null) {
          clearTimeout(suggestionRefreshTimer);
          suggestionRefreshTimer = null;
        }
        suggestionRequestSeq += 1;
        suggestionsVisible = false;
        suggestions = [];
        selectedSuggestion = 0;
        suggestionPopup.classList.remove('visible');
        suggestionPopup.style.display = 'none';
        suggestionPopup.textContent = '';
      }

      function positionSuggestions() {
        if (!suggestionsVisible) return;
        const buf = term.buffer && term.buffer.active;
        if (!buf || buf.type === 'alternate') { hideSuggestions(); return; }
        const dims = cellMetrics();
        const actualCursorX = Math.max(0, Number(buf.cursorX) || 0);
        const cursorX = Math.max(actualCursorX, ghostAnchorX == null ? 0 : ghostAnchorX);
        const cursorY = Math.max(0, Number(buf.cursorY) || 0);
        const screen = term.element && term.element.querySelector
          ? term.element.querySelector('.xterm-screen') : null;
        const hostRect = terminalHost.getBoundingClientRect();
        const screenRect = screen ? screen.getBoundingClientRect() : null;
        const originLeft = screenRect ? screenRect.left - hostRect.left : 4;
        const originTop = screenRect ? screenRect.top - hostRect.top : 4;
        const maxWidth = Math.max(180, Math.min(520, terminalHost.clientWidth - 24));
        suggestionPopup.style.width = maxWidth + 'px';
        suggestionPopup.style.maxWidth = Math.max(120, terminalHost.clientWidth - 24) + 'px';
        suggestionPopup.style.display = 'block';
        const effectiveWidth = Math.min(maxWidth, terminalHost.clientWidth - 8);
        const left = Math.max(4, Math.min(
          terminalHost.clientWidth - effectiveWidth - 4,
          originLeft + cursorX * dims.width
        ));
        let top = originTop + (cursorY + 1) * dims.height + 4;
        const popupHeight = suggestionPopup.offsetHeight || 180;
        if (top + popupHeight > terminalHost.clientHeight - 4)
          top = Math.max(4, originTop + cursorY * dims.height - popupHeight - 4);
        top = Math.max(4, Math.min(top, Math.max(4, terminalHost.clientHeight - popupHeight - 4)));
        suggestionPopup.style.left = left + 'px';
        suggestionPopup.style.top = top + 'px';
      }

      function renderSuggestions(values, emptyMessage) {
        suggestions = (values || []).slice(0, 5).map(function (value) {
          if (typeof value === 'string') {
            return {
              command: value,
              confidence: 60,
              source: 'history',
              reason: 'Learned from terminal history'
            };
          }
          return value || {};
        }).filter(function (value) { return !!value.command; });
        selectedSuggestion = Math.max(0, Math.min(selectedSuggestion, Math.max(0, suggestions.length - 1)));
        suggestionPopup.textContent = '';

        const heading = document.createElement('div');
        heading.className = 'suggestion-heading';
        const title = document.createElement('span');
        title.textContent = 'AI command suggestions';
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = suggestions.length ? suggestions.length + ' found' : 'No matches';
        heading.appendChild(title);
        heading.appendChild(count);
        suggestionPopup.appendChild(heading);

        if (!suggestions.length) {
          const empty = document.createElement('div');
          empty.className = 'suggestion-empty';
          empty.textContent = emptyMessage || 'No matching commands in this server’s learned history yet.';
          suggestionPopup.appendChild(empty);
        } else {
          suggestions.forEach(function (command, index) {
            const row = document.createElement('div');
            row.className = 'suggestion-row' + (index === selectedSuggestion ? ' active' : '');
            row.setAttribute('role', 'option');
            row.setAttribute('aria-selected', index === selectedSuggestion ? 'true' : 'false');
            const number = document.createElement('span');
            number.className = 'suggestion-index';
            number.textContent = String(index + 1);
            const value = document.createElement('span');
            value.className = 'suggestion-command';
            value.textContent = command.command;
            row.appendChild(number);
            row.appendChild(value);
            const meta = document.createElement('span');
            meta.className = 'suggestion-meta';
            const source = document.createElement('span');
            source.className = 'suggestion-source';
            source.textContent = String(command.source || 'history');
            source.title = String(command.reason || 'Learned from terminal context');
            const confidence = document.createElement('span');
            confidence.className = 'suggestion-confidence';
            const conf = Number(command.confidence);
            confidence.textContent = Number.isFinite(conf) ? Math.round(conf) + '%' : '';
            meta.appendChild(source);
            meta.appendChild(confidence);
            row.appendChild(meta);
            row.addEventListener('mouseenter', function () {
              selectedSuggestion = index;
              updateSuggestionSelection();
            });
            row.addEventListener('click', function () { acceptSuggestion(index); });
            suggestionPopup.appendChild(row);
          });
        }

        const footer = document.createElement('div');
        footer.className = 'suggestion-footer';
        footer.textContent = suggestions.length
          ? '↑ ↓ Select   ·   Enter / Tab Insert   ·   Esc Close'
          : 'Esc Close   ·   Keep typing to refine';
        suggestionPopup.appendChild(footer);
        suggestionsVisible = true;
        suggestionPopup.classList.add('visible');
        positionSuggestions();
      }

      function updateSuggestionSelection() {
        const rows = suggestionPopup.querySelectorAll('.suggestion-row');
        rows.forEach(function (row, index) {
          const active = index === selectedSuggestion;
          row.classList.toggle('active', active);
          row.setAttribute('aria-selected', active ? 'true' : 'false');
        });
      }

      function acceptSuggestion(index) {
        if (!suggestionsVisible || index < 0 || index >= suggestions.length) return false;
        const candidate = normalizeGhostCandidate(suggestions[index].command || '');
        if (inputModel && !candidate.toLowerCase().startsWith(inputModel.toLowerCase())) return false;
        const suffix = candidate.slice(inputModel.length);
        if (suffix) sendInput(suffix);
        if (bridge && bridge.report_suggestion_accepted) {
          try { bridge.report_suggestion_accepted(candidate); } catch (e) {}
        }
        inputModel = candidate;
        inputModelKnown = true;
        ghostAnchorX = null;
        hideSuggestions();
        hideGhost();
        term.focus();
        return true;
      }

      function requestSuggestions(forceOpen) {
        if (suggestionRefreshTimer !== null) {
          clearTimeout(suggestionRefreshTimer);
          suggestionRefreshTimer = null;
        }
        if (forceOpen) {
          requestSuggestionsNow(true);
          return;
        }
        if (!suggestionsVisible) return;

        // A new keystroke invalidates in-flight results immediately, but waits
        // until typing pauses before asking Python to rank the history again.
        suggestionRequestSeq += 1;
        suggestionRefreshTimer = setTimeout(function () {
          suggestionRefreshTimer = null;
          if (suggestionsVisible) requestSuggestionsNow(false);
        }, SUGGESTION_REFRESH_DEBOUNCE_MS);
      }

      function requestSuggestionsNow(forceOpen) {
        if (!terminalAI.suggestionsEnabled) {
          if (forceOpen) hideSuggestions();
          return;
        }
        if (!forceOpen && !suggestionsVisible) return;
        if (!inputModelKnown || !bridge || (!bridge.suggest_command_details && !bridge.suggest_commands)) {
          if (forceOpen) renderSuggestions([], 'This command line is not in a safe-to-complete state. Press Esc, then type a new command.');
          else hideSuggestions();
          return;
        }
        if (forceOpen) {
          suggestionsVisible = true;
          suggestionPopup.classList.add('visible');
          suggestionPopup.style.display = 'block';
          suggestionPopup.textContent = '';
          const loading = document.createElement('div');
          loading.className = 'suggestion-empty';
          loading.textContent = 'Loading command suggestions…';
          suggestionPopup.appendChild(loading);
          positionSuggestions();
        }
        const seq = ++suggestionRequestSeq;
        try {
          const suggestApi = bridge.suggest_command_details || bridge.suggest_commands;
          suggestApi(
            inputModel,
            completionContext.cwd || '/',
            completionContext.shell || '',
            completionContext.serverId || '',
            function (payload) {
              if (seq !== suggestionRequestSeq || (!forceOpen && !suggestionsVisible)) return;
              let rawValues = [];
              try {
                const parsed = JSON.parse(String(payload || '[]'));
                rawValues = Array.isArray(parsed) ? parsed : [];
              } catch (e) {}
              const seen = new Set();
              const values = rawValues.map(function (item) {
                if (typeof item === 'string') {
                  return { command: normalizeGhostCandidate(item), confidence: 60, source: 'history', reason: 'Learned from terminal history' };
                }
                const copy = Object.assign({}, item || {});
                copy.command = normalizeGhostCandidate(copy.command || '');
                return copy;
              }).filter(function (item) {
                const value = String(item.command || '');
                if (!value || value.length <= inputModel.length) return false;
                if (inputModel && !value.toLowerCase().startsWith(inputModel.toLowerCase())) return false;
                const key = value.toLowerCase();
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
              }).slice(0, 5);
              renderSuggestions(values);
            }
          );
        } catch (e) {
          if (forceOpen) renderSuggestions([], 'Could not load command suggestions.');
          else hideSuggestions();
        }
      }

      function cellMetrics() {
        try {
          const d = term._core && term._core._renderService && term._core._renderService.dimensions;
          const width = d && d.css && d.css.cell && d.css.cell.width;
          const height = d && d.css && d.css.cell && d.css.cell.height;
          return { width: width || 8, height: height || 16 };
        } catch (e) {
          return { width: 8, height: 16 };
        }
      }

      function positionGhost() {
        if (!ghostSuffix || !inputModelKnown) return;
        const dims = cellMetrics();
        const buf = term.buffer && term.buffer.active;
        if (!buf || buf.type === 'alternate') {
          hideGhost();
          return;
        }

                  if (neighborIdx < 0) return;
                  ev.preventDefault();
                  ev.stopPropagation();
                  const widths = headers.map(function(h){ return h.getBoundingClientRect().width; });
                  const startX = ev.clientX;
                  const startThis = widths[colIdx];
                  const startNeighbor = widths[neighborIdx];
                  function move(e){
                    const delta = e.clientX - startX;
                    const min = 54;
                    const nextThis = Math.max(min, startThis + delta);
                    const nextNeighbor = Math.max(min, startNeighbor - delta);
                    if ((nextThis + nextNeighbor) > (startThis + startNeighbor + 0.01)) return;
                    widths[colIdx] = nextThis;
                    widths[neighborIdx] = nextNeighbor;
                    colsEls.forEach(function(col, i){ col.style.width = widths[i] + 'px'; });
                  }
                  function up(){
                    document.removeEventListener('mousemove', move);
                    document.removeEventListener('mouseup', up);
                    document.body.style.userSelect = '';
                  }
                  document.body.style.userSelect = 'none';
                  document.addEventListener('mousemove', move);
                  document.addEventListener('mouseup', up);
                });
              });
              const bodyEl = block.querySelector('.body');
              if (bodyEl) {
                // Table scroll stays on the table; shell keeps its own scrollbar.
                // Only stopPropagation when the table body can still scroll in that direction.
                bodyEl.addEventListener('wheel', function(ev){
                  // The pointer is inside a virtual table: wheel events belong
                  // to that table only. Never bubble them to xterm, even at the
                  // table's top/bottom edge. Native browser scrolling remains
                  // enabled, including horizontal scrolling and scrollbar behavior.
                  ev.stopPropagation();
                }, {passive:true});
              }
            }

            function cellH(){
              try {
                const d=term._core&&term._core._renderService&&term._core._renderService.dimensions;
                if (d&&d.css&&d.css.cell&&d.css.cell.height) return d.css.cell.height;
              } catch(e){}
              return (host.clientHeight||400)/Math.max(term.rows,1);
            }

            function sync(){
              const list=window._sshdockTbls||[];
              const activeBuffer = term.buffer && term.buffer.active;
              const inAlternateScreen = !!activeBuffer && activeBuffer.type === 'alternate';
              const viewportY=activeBuffer ? activeBuffer.viewportY : 0;
              const ch=cellH();
              const viewH=host.clientHeight||0;
              for (let i=0;i<list.length;i++){
                const b=list[i];
                if (!b||!b.parentNode) continue;
                if (inAlternateScreen) {
                  // Full-screen/TUI applications (nano, vim, less, top, etc.)
                  // own the entire terminal viewport. Never let our HTML table
                  // overlay that application.
                  b.style.display = 'none';
                  continue;
                }
                const markerLine = b._anchorMarker ? b._anchorMarker.line : -1;
                // A marker is only a reflow aid. If xterm disposes it after
                // trimming, keep the last known anchor instead of hiding the
                // whole result table.
                const anchor = markerLine >= 0
                  ? Math.max(0, markerLine - (b._cells|RESERVE))
                  : Math.max(0, b._startAbs|0);
                const start = anchor;
                b._startAbs = start;
                const cells=b._cells|RESERVE;
                const top=(start-viewportY)*ch;
                const height=cells*ch;
                b.style.top=top+'px';
                b.style.height=height+'px';
                b.style.left='0px';
                // Keep HTML result blocks inside the same content width as xterm,
                // leaving the right-side scrollbar gutter completely free.
                b.style.width='calc(100% - 18px)';
                b.style.right='18px';
                // Only visible while its reserved lines intersect the viewport
                b.style.display = (top+height>0 && top<viewH) ? 'flex' : 'none';
              }
            }

            window._sshdockSync = sync;
            if (!term._sshdockScrollBarHook) {
              term._sshdockScrollBarHook = true;
              try {
                term.onScroll(function(){ sync(); reportScrollState(); });
              } catch(e){}
              // xterm.js exposes normal/alternate buffer transitions directly.
              // This is the reliable generic signal for full-screen terminal apps.
              try {
                if (term.buffer && term.buffer.onBufferChange) {
                  term.buffer.onBufferChange(function(){ sync(); });
                }
              } catch(e){}
              // Also sync when xterm re-renders / fits
              try {
                if (term.onRender) term.onRender(function(){ sync(); });
              } catch(e){}
              window.addEventListener('resize', function(){ sync(); });
              if (window.ResizeObserver) {
                try { new ResizeObserver(function(){ sync(); }).observe(host); } catch(e){}
              }
            }
            sync();
            requestAnimationFrame(sync);
            setTimeout(sync, 40);
            setTimeout(sync, 150);
            try { term.focus(); } catch(e){}
          } catch (e) {
            console.error('showTable', e);
          }
        },
        fit: function () {
          try {
            if (fitAddon) {
              fitAddon.fit();
            }
          } catch (e) {}
          try {
            if (window._sshdockSync) {
              window._sshdockSync();
              requestAnimationFrame(window._sshdockSync);
            }
          } catch (e) {}
          reportScrollState();
          reportSize();
        },

        hideTable: function () {
          const blocks = window._sshdockTbls || [];
          for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            if (block && block._anchorMarker) {
              try { block._anchorMarker.dispose(); } catch (e) {}
              block._anchorMarker = null;
            }
            if (block && block.parentNode) block.parentNode.removeChild(block);
          }
          window._sshdockTbls = [];
        },


        find: function (query, options) {
          try {
            if (!term || !query) return false;
            const q = String(query);
            const buffer = term.buffer.active;
            const start = q === lastFindQuery ? lastFindRow + 1 : 0;
            const total = buffer.length;
            for (let pass = 0; pass < 2; pass++) {
              const begin = pass === 0 ? start : 0;
              const end = pass === 0 ? total : Math.min(start, total);
              for (let row = begin; row < end; row++) {
                const line = buffer.getLine(row);
                if (!line) continue;
                const text = line.translateToString(true);
                const col = text.toLowerCase().indexOf(q.toLowerCase());
                if (col >= 0) {
                  lastFindQuery = q;
                  lastFindRow = row;
                  term.scrollToLine(row);
                  if (term.select) term.select(col, row, Math.max(1, q.length));
                  term.focus();
                  return true;
                }
              }
            }
            return false;
          } catch (e) { return false; }
        }
      };

      function bindBridge() {
        if (typeof qt === 'undefined' || !qt.webChannelTransport) {
          // Standalone / fallback
          window.sshdockTerm.ready = true;
          scheduleFit();
          return;
        }
        new QWebChannel(qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge;
          window.sshdockTerm.ready = true;
          scheduleFit();
          flushPendingInput();
          if (bridge && bridge.js_ready) bridge.js_ready();
          reportScrollState();
          // Flush any cwd reported before the bridge was ready
          if (bridge && bridge.report_cwd && window.sshdockReportCwd) {
            try { bridge.report_cwd(window.sshdockReportCwd); } catch (e) {}
          }
        });
      }
// Qt injects qt.webChannelTransport after page load
      if (document.readyState === 'complete') bindBridge();
      else window.addEventListener('load', bindBridge);
      setTimeout(bindBridge, 50);
    })();
  </script>
</body>
</html>
