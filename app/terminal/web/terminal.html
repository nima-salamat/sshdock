<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#080d13" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #080d13 !important; color: #e6edf3;
      overflow: hidden; color-scheme: dark;
    }
    #term-root, #terminal {
      height: 100%; width: 100%;
      box-sizing: border-box;
    }
    #terminal {
      padding: 4px 16px 4px 4px;
      position: relative;
      box-sizing: border-box;
    }
    .xterm { height: 100%; }
    /* Reserve a real right-side gutter for the native PySide6 scrollbar. */
    #terminal {
      padding-right: 18px;
    }
    .xterm {
      height: 100%;
      width: 100%;
    }
    .xterm .xterm-viewport {
      overflow-y: scroll !important;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /*
     * Magic Docker table — plan:
     *  1) Shell prints 20 blank lines then PS1.
     *  2) We place one HTML block per table, height = 20 * cellHeight.
     *  3) top = (startAbs - viewportY) * cellHeight  → moves with shell scroll.
     *  4) .body { overflow:auto } → table has its own scrollbar.
     *  5) Wheel on .body does not scroll the shell (stopPropagation) when table can scroll.
     *  6) Right padding so table scrollbar sits clear of xterm viewport scrollbar.
     *  7) Up to ~20 data rows fit without internal scrollbar when content is short.
     *  8) Column headers are drag-resizable (col-resize cursor on right edge).
     */
    .sshdock-tbl {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background: #0c1219;
      border: 1px solid #2a3440;
      border-radius: 3px;
      overflow: hidden;
      font-family: Cascadia Mono, Consolas, Menlo, monospace;
      font-size: 12px;
      color: #e6edf3;
      pointer-events: auto;
      margin-right: 0;
    }
    .sshdock-tbl .cap {
      flex: 0 0 auto;
      padding: 2px 8px;
      font-size: 11px;
      color: #8b949e;
      background: #0e141c;
      border-bottom: 1px solid #1e2630;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sshdock-tbl .body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;           /* own scrollbar */
      overscroll-behavior: contain;
      /* Inset so body scrollbar stays inside the block and clear of shell scrollbar */
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: #3d4a5c #0c1219;
    }
    .sshdock-tbl .body::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .sshdock-tbl .body::-webkit-scrollbar-track {
      background: #0c1219;
    }
    .sshdock-tbl .body::-webkit-scrollbar-thumb {
      background: #3d4a5c;
      border-radius: 4px;
    }
    .sshdock-tbl .body::-webkit-scrollbar-thumb:hover {
      background: #526078;
    }
    .sshdock-tbl table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      table-layout: auto;
    }
    .sshdock-tbl thead th {
      position: sticky;
      top: 0;
      background: #141b24;
      color: #7cb7ff;
      font-weight: 600;
      text-align: left;
      padding: 2px 8px;
      border-bottom: 1px solid #2a3440;
      border-right: 1px solid #1a222c;
      white-space: nowrap;
      min-width: 48px;
      cursor: col-resize;
      user-select: none;
    }
    .sshdock-tbl thead th:hover {
      background: #1a2430;
    }
    .sshdock-tbl tbody td {
      padding: 2px 8px;
      border-bottom: 1px solid #121820;
      border-right: 1px solid #121820;
      white-space: nowrap;
    }
    .sshdock-tbl .col-id {
      min-width: 52ch !important;
      width: max-content !important;
      max-width: none !important;
    }
    .sshdock-tbl tbody tr:nth-child(even) { background: rgba(18,24,32,0.65); }
    .sshdock-tbl tbody tr:hover { background: #152032; }
    .sshdock-tbl td.st-up { color: #3fb950; }
    .sshdock-tbl td.st-down { color: #f85149; }
    .sshdock-tbl td.st-warn { color: #d29922; }

    /* Predictive command ghost text. It is an overlay, never terminal content. */
    #sshdock-ghost {
      position: absolute;
      z-index: 70;
      pointer-events: none;
      white-space: pre;
      font-family: Cascadia Mono, Consolas, Menlo, monospace;
      font-size: 13px;
      line-height: 1.2;
      color: rgba(148, 163, 184, 0.46);
      opacity: 0;
      transition: opacity 60ms linear;
      overflow: hidden;
      max-width: calc(100% - 26px);
    }
    #sshdock-ghost.visible { opacity: 1; }
    #sshdock-ghost.light { color: rgba(71, 85, 105, 0.48); }

  </style>
</head>
<body>
  <div id="term-root">
    <div id="terminal"><div id="sshdock-ghost" aria-hidden="true"></div></div>
  </div>

<script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/qwebchannel.js"></script>
  <script>
    (function () {
      function resolveTerminal() {
        if (window.Terminal) return window.Terminal;
        if (window.xterm && window.xterm.Terminal) return window.xterm.Terminal;
        return null;
      }
      function resolveFitAddon() {
        if (window.FitAddon && window.FitAddon.FitAddon) return window.FitAddon.FitAddon;
        if (window.FitAddon) return window.FitAddon;
        return null;
      }

      const TerminalCtor = resolveTerminal();
      const FitCtor = resolveFitAddon();
      if (!TerminalCtor) {
        document.body.innerHTML = '<pre style="color:#f88;padding:12px">xterm.js failed to load</pre>';
        return;
      }

      const term = new TerminalCtor({
        cursorBlink: true,
        fontFamily: 'Cascadia Mono, Consolas, Menlo, monospace',
        fontSize: 13,
        lineHeight: 1.2,
        convertEol: true,
        drawBoldTextInBrightColors: true,
        minimumContrastRatio: 1,
        theme: {
          background: '#080d13',
          foreground: '#e6edf3',
          cursor: '#e6edf3',
          selectionBackground: '#264f78',
          black: '#0b0f14',
          red: '#ff5f56',
          green: '#5cff8a',
          yellow: '#ffd866',
          blue: '#5aa9ff',
          magenta: '#d68cff',
          cyan: '#52e8ff',
          white: '#e6edf3',
          brightBlack: '#66727e',
          brightRed: '#ff6b6b',
          brightGreen: '#69f58f',
          brightYellow: '#ffe58a',
          brightBlue: '#78b9ff',
          brightMagenta: '#e7a8ff',
          brightCyan: '#82f1ff',
          brightWhite: '#ffffff'
        },
        allowProposedApi: true,
        scrollback: 5000
      });

      const fitAddon = FitCtor ? new FitCtor() : null;
      if (fitAddon) term.loadAddon(fitAddon);

      const terminalHost = document.getElementById('terminal');
      term.open(terminalHost);

      const ghost = document.getElementById('sshdock-ghost') || document.createElement('div');
      if (!ghost.parentNode) terminalHost.appendChild(ghost);

      const completionContext = {
        serverId: '',
        cwd: '/',
        shell: ''
      };
      let ghostCandidate = '';
      let ghostSuffix = '';
      let ghostRequestSeq = 0;
      let inputModel = '';
      let inputModelKnown = true;

      function hideGhost() {
        ghostCandidate = '';
        ghostSuffix = '';
        ghost.dataset.leadingWhitespace = '0';
        ghost.classList.remove('visible');
        ghost.textContent = '';
      }

      function cellMetrics() {
        try {
          const d = term._core && term._core._renderService && term._core._renderService.dimensions;
          const width = d && d.css && d.css.cell && d.css.cell.width;
          const height = d && d.css && d.css.cell && d.css.cell.height;
          return { width: width || 8, height: height || 16 };
        } catch (e) {
          return { width: 8, height: 16 };
        }
      }

      function positionGhost() {
        if (!ghostSuffix || !inputModelKnown) return;
        const dims = cellMetrics();
        const buf = term.buffer && term.buffer.active;
        if (!buf || buf.type === 'alternate') {
          hideGhost();
          return;
        }

        const cursorX = Math.max(0, buf.cursorX || 0);
        const cursorY = Math.max(0, buf.cursorY || 0);
        const leadingWhitespace = Number(ghost.dataset.leadingWhitespace) || 0;
        const left = 4 + cursorX * dims.width + leadingWhitespace * dims.width;
        const top = 4 + cursorY * dims.height;
        const visibleLength = Math.max(1, ghostSuffix.length - leadingWhitespace);
        const available = Math.max(0, terminalHost.clientWidth - left - 18);
        if (available < Math.min(18, visibleLength * dims.width)) {
          hideGhost();
          return;
        }
        ghost.style.left = left + 'px';
        ghost.style.top = top + 'px';
        ghost.style.maxWidth = available + 'px';
      }

      function requestGhostPrediction() {
        if (!inputModelKnown || !inputModel || !bridge || !bridge.predict_command) {
          hideGhost();
          return;
        }
        const seq = ++ghostRequestSeq;
        try {
          bridge.predict_command(
            inputModel,
            completionContext.cwd || '/',
            completionContext.shell || '',
            completionContext.serverId || '',
            function (candidate) {
              if (seq !== ghostRequestSeq) return;
              const value = String(candidate || '');
              if (!value || !value.toLowerCase().startsWith(inputModel.toLowerCase()) || value.length <= inputModel.length) {
                hideGhost();
                return;
              }
              ghostCandidate = value;
              ghostSuffix = value.slice(inputModel.length);
              // Keep leading whitespace as layout geometry rather than relying
              // on HTML text rendering, so "cd /path" is visibly spaced everywhere.
              const leading = (ghostSuffix.match(/^[ \t]+/) || [''])[0];
              const leadingWhitespace = leading.replace(/\t/g, '    ').length;
              ghost.dataset.leadingWhitespace = String(leadingWhitespace);
              ghost.textContent = ghostSuffix
                .slice(leading.length)
                .replace(/ /g, '\u00a0')
                .replace(/\t/g, '\u00a0\u00a0\u00a0\u00a0');
              ghost.classList.add('visible');
              positionGhost();
            }
          );
        } catch (e) {
          hideGhost();
        }
      }

      function setInputModel(value, known) {
        inputModel = value || '';
        inputModelKnown = known !== false;
        if (!inputModelKnown) {
          hideGhost();
          return;
        }
        requestGhostPrediction();
      }

      function observeInput(data) {
        const value = String(data || '');
        if (!value) return;

        /* Printable insertion is only unambiguous at the local cursor. */
        if (/^[\x20-\x7e]+$/.test(value)) {
          inputModel += value;
          requestGhostPrediction();
          return;
        }

        if (value === '\x7f' || value === '\b') {
          if (inputModel.length) {
            inputModel = inputModel.slice(0, -1);
            requestGhostPrediction();
          } else {
            hideGhost();
          }
          return;
        }

        if (value === '\r' || value === '\n') {
          const submitted = inputModel;
          hideGhost();
          if (submitted && bridge && bridge.report_command) {
            try { bridge.report_command(submitted); } catch (e) {}
          }
          inputModel = '';
          inputModelKnown = true;
          return;
        }

        /* Ctrl+U / Ctrl+C / Ctrl+D and readline cursor operations make a
           local shadow buffer unreliable; fall back safely instead of
           suggesting the wrong command. */
        if (value.indexOf('\x03') >= 0 || value.indexOf('\x04') >= 0) {
          inputModel = '';
          inputModelKnown = value.indexOf('\x04') < 0;
          hideGhost();
          return;
        }

        if (value.indexOf('\x15') >= 0) {
          inputModel = '';
          inputModelKnown = true;
          hideGhost();
          requestGhostPrediction();
          return;
        }

        if (value.indexOf('\x1b') >= 0 || value.indexOf('\t') >= 0) {
          inputModelKnown = false;
          hideGhost();
          return;
        }

        /* Multiline paste and unknown control sequences invalidate the model
           until the next explicit command boundary. */
        if (value.indexOf('\n') >= 0 || value.indexOf('\r') >= 0) {
          inputModel = '';
          inputModelKnown = false;
          hideGhost();
          return;
        }

        inputModelKnown = false;
        hideGhost();
      }

      function updateCompletionTheme(theme) {
        ghost.classList.toggle('light', !!(theme && theme.background && String(theme.background).toLowerCase() !== '#080d13'));
      }

      // PySide6 owns the visible scrollbar. Report xterm's logical scroll
      // range to the native QScrollBar and keep xterm as the source of truth.
      function activeScrollState() {
        const active = term.buffer && term.buffer.active;
        const alternate = !!active && active.type === 'alternate';
        const normal = term.buffer && term.buffer.normal;
        const rows = Math.max(1, term.rows || 1);
        if (alternate) return { maxLine: 0, viewportLine: 0, rows: rows, alternate: true };
        const baseY = Number(normal && normal.baseY) || 0;
        const length = Number(normal && normal.length) || 0;
        const maxLine = Math.max(0, baseY, length - rows);
        const viewportLine = Math.max(0, Math.min(maxLine, Number(active && active.viewportY) || 0));
        return { maxLine, viewportLine, rows, alternate: false };
      }

      function reportScrollState() {
        if (!bridge || !bridge.report_scroll) return;
        const state = activeScrollState();
        try { bridge.report_scroll(state.maxLine, state.viewportLine, state.rows); } catch (e) {}
      }

      function syncScrollBar() {
        reportScrollState();
      }

      let bridge = null;
      let pendingInput = '';

      function sendInput(data) {
        const value = String(data || '');
        if (!value) return;
        if (bridge && bridge.send_input) {
          try {
            bridge.send_input(value);
            return;
          } catch (e) {}
        }
        pendingInput += value;
      }

      function flushPendingInput() {
        if (!pendingInput || !bridge || !bridge.send_input) return;
        const value = pendingInput;
        pendingInput = '';
        try {
          bridge.send_input(value);
        } catch (e) {
          pendingInput = value;
        }
      }

      function reportCwdFromOsc(data) {
        try {
          let value = String(data || '');
          // OSC 7 forms: file://host/path | file:///path | /path
          if (value.indexOf('file://') === 0) {
            value = value.slice('file://'.length);
            const slash = value.indexOf('/');
            value = slash >= 0 ? value.slice(slash) : '/';
          }
          try { value = decodeURIComponent(value); } catch (e) {}
          if (!value || value.charAt(0) !== '/') value = '/' + (value || '');
          value = value.replace(/\/{2,}/g, '/');
          if (value.length > 1 && value.endsWith('/')) value = value.slice(0, -1);
          window.sshdockReportCwd = value;
          if (bridge && bridge.report_cwd) bridge.report_cwd(value);
          return true; // always consume so sequence never prints as text
        } catch (e) { return true; }
      }
      try {
        if (term.parser && term.parser.registerOscHandler) term.parser.registerOscHandler(7, reportCwdFromOsc);
        else if (term.registerOscHandler) term.registerOscHandler(7, reportCwdFromOsc);
      } catch (e) {}

      function reportMagicFromOsc(data) {
        try {
          const payload = String(data || '').trim();
          if (payload && bridge && bridge.report_magic) {
            bridge.report_magic(payload);
          }
          return true; // consume OSC 777 so it can never appear as terminal text
        } catch (e) {
          return true;
        }
      }
      try {
        if (term.parser && term.parser.registerOscHandler) term.parser.registerOscHandler(777, reportMagicFromOsc);
        else if (term.registerOscHandler) term.registerOscHandler(777, reportMagicFromOsc);
      } catch (e) {}
      let lastCols = 0, lastRows = 0;
      let fitTimer = null;
      let lastFindQuery = '';
      let lastFindRow = -1;

      function reportSize() {
        if (!fitAddon) return;
        try { fitAddon.fit(); } catch (e) {}
        reportScrollState();
        const cols = term.cols, rows = term.rows;
        if (cols === lastCols && rows === lastRows) return;
        lastCols = cols; lastRows = rows;
        if (bridge && bridge.report_size) {
          bridge.report_size(cols, rows);
        }
      }

      function scheduleFit() {
        if (fitTimer) clearTimeout(fitTimer);
        fitTimer = setTimeout(function () {
          reportSize();
          try { if (window._sshdockSync) window._sshdockSync(); } catch (e) {}
          reportScrollState();
          requestAnimationFrame(function () {
            try { if (window._sshdockSync) window._sshdockSync(); } catch (e) {}
            reportScrollState();
          });
        }, 80);
      }

      try { term.onWriteParsed(function(){ syncScrollBar(); }); } catch (e) {}
      try { term.onRender(function(){ syncScrollBar(); }); } catch (e) {}
      try { term.onScroll(function(){ syncScrollBar(); }); } catch (e) {}

      window.addEventListener('resize', scheduleFit);
      // Observe container size (splitter drags)
      if (window.ResizeObserver) {
        new ResizeObserver(scheduleFit).observe(document.getElementById('term-root') || document.getElementById('terminal'));
      }

      term.onData(function (data) {
        observeInput(data);
        sendInput(data);
      });

      // API for Python
      term.attachCustomKeyEventHandler(function (ev) {
        if (ev.type === 'keydown' && ev.ctrlKey && ev.shiftKey && (ev.key === 'F' || ev.code === 'KeyF')) {
          if (bridge && bridge.request_find) bridge.request_find();
          return false;
        }
        if (ev.type === 'keydown' && (ev.key === 'Tab' || ev.key === 'ArrowRight') && ghostSuffix && inputModelKnown && !ev.ctrlKey && !ev.altKey) {
          ev.preventDefault();
          ev.stopPropagation();
          try {
            sendInput(ghostSuffix);
            inputModel += ghostSuffix;
            hideGhost();
          } catch (e) {
            inputModelKnown = false;
            hideGhost();
          }
          return false;
        }
        if (ev.type === 'keydown' && ev.key === 'Escape') {
          hideGhost();
        }
        if (ev.type === 'keydown' && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown' || ev.key === 'Home' || ev.key === 'End')) {
          inputModelKnown = false;
          hideGhost();
        }
        return true;
      });

      window.sshdockTerm = {
        write: function (data) { term.write(data); },
        setCompletionContext: function (data) {
          try {
            const value = data || {};
            completionContext.serverId = String(value.serverId || '');
            completionContext.cwd = String(value.cwd || '/');
            completionContext.shell = String(value.shell || '');
            if (inputModelKnown) requestGhostPrediction();
          } catch (e) {
            hideGhost();
          }
        },
        setTheme: function (theme) {
          try { updateCompletionTheme(theme || {}); } catch (e) {}
          try { if (theme) term.options.theme = theme; } catch (e) {}
        },
        clear: function () { term.clear(); term.write('\x1b[H\x1b[2J'); },
        focus: function () { term.focus(); },
        scrollToLine: function (line) {
          const target = Math.max(0, Math.round(Number(line) || 0));
          try { term.scrollToLine(target); } catch (e) {}
          reportScrollState();
        },
        showTable: function (payload) {
          try {
            /*
             * Layout math (fixed):
             *   Shell: command, then 20 newlines, then PS1.
             *   Cursor is on PS1 when we run. Absolute line of PS1 = baseY+cursorY.
             *   Table covers [promptAbs-20, promptAbs)  → 20 cells.
             *   Pixel top in viewport = (startAbs - viewportY) * cellH
             *   Pixel height           = 20 * cellH
             * Shell scroll updates viewportY → we recompute top (term.onScroll).
             * Table .body scrolls independently; wheel is stopped inside it when it can scroll.
             * Block is inset from the right so its scrollbar never overlaps the shell scrollbar.
             */
            const data = (typeof payload === 'string') ? JSON.parse(payload) : payload;
            const cols = data.columns || [];
            const rows = data.rows || [];
            const cmd = (data.command || '').trim();
            const title = data.title || 'result';
            const RESERVE = 20;

            const buf = term.buffer.active;
            const promptAbs = buf.baseY + buf.cursorY;
            let anchorMarker = null;
            try {
              // xterm markers follow buffer reflow, so the table stays attached
              // to the same prompt even when window width changes.
              anchorMarker = term.registerMarker(0);
            } catch (e) {}
            const startAbs = Math.max(0, promptAbs - RESERVE);

            function esc(s) {
              return String(s == null ? '' : s)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }
            function statusClass(v) {
              const low = String(v).toLowerCase();
              if (/up |running|healthy|online/.test(low)) return 'st-up';
              if (/exit|dead|unhealthy|stopped/.test(low)) return 'st-down';
              if (/created|paused|restarting/.test(low)) return 'st-warn';
              return '';
            }
            function isIdCol(n) {
              const s = String(n||'').toLowerCase();
              return s === 'id' || s === 'image id' || s.endsWith(' id');
            }

            // Host = xterm element so coordinates match the glyph grid
            const host = term.element || document.getElementById('terminal');
            if (!host) return;
            if (getComputedStyle(host).position === 'static') host.style.position = 'relative';

            if (!window._sshdockTbls) window._sshdockTbls = [];

            const block = document.createElement('div');
            block.className = 'sshdock-tbl';
            block._startAbs = startAbs;
            block._anchorPromptAbs = promptAbs;
            block._cells = RESERVE;
            block._anchorMarker = anchorMarker;

            let html = '<div class="cap">' + esc(cmd ? ('$ '+cmd) : ('$ '+title)) +
              ' · ' + esc(title) + ' · ' + rows.length + ' rows</div><div class="body"><table><thead><tr>';
            cols.forEach(function(c) {
              html += '<th'+(isIdCol(c)?' class="col-id"':'')+'>'+esc(c)+'</th>';
            });
            html += '</tr></thead><tbody>';
            const statusIdx = cols.findIndex(function(c){
              const s=String(c).toLowerCase(); return s==='status'||s==='state';
            });
            rows.forEach(function(row){
              html += '<tr>';
              (row||[]).forEach(function(cell,i){
                const val = cell==null?'':String(cell);
                const cl = [];
                if (i===statusIdx){ const s=statusClass(val); if(s) cl.push(s); }
                if (isIdCol(cols[i])) cl.push('col-id');
                html += '<td'+(cl.length?' class="'+cl.join(' ')+'"':'')+
                  ' title="'+esc(val)+'">'+esc(val)+'</td>';
              });
              html += '</tr>';
            });
            html += '</tbody></table></div>';
            block.innerHTML = html;
            host.appendChild(block);
            window._sshdockTbls.push(block);

            // ID column full width + drag-resize headers (all columns)
            const table = block.querySelector('table');
            if (table) {
              block.addEventListener('wheel', function(ev){
                if (!ev.target.closest('.body')) {
                  ev.stopPropagation();
                }
              }, {passive:true});
              table.querySelectorAll('thead th').forEach(function(th, colIdx){
                if (th.classList.contains('col-id')) {
                  let maxLen = (th.textContent||'').length;
                  table.querySelectorAll('tbody tr').forEach(function(tr){
                    const td=tr.children[colIdx];
                    if (td) maxLen=Math.max(maxLen,(td.textContent||'').length);
                  });
                  const w = Math.max(200, maxLen*8.5+28);
                  th.style.width = th.style.minWidth = w+'px';
                  table.querySelectorAll('tbody tr').forEach(function(tr){
                    const td=tr.children[colIdx];
                    if (td) td.style.width = td.style.minWidth = w+'px';
                  });
                }
                // Drag to resize any column from the right edge of the header
                th.addEventListener('mousedown', function(ev){
                  const rect=th.getBoundingClientRect();
                  if (rect.right-ev.clientX>10) return; // only near right edge
                  ev.preventDefault();
                  ev.stopPropagation();
                  const x0=ev.clientX, w0=th.offsetWidth;
                  function move(e){
                    const w=Math.max(48,w0+(e.clientX-x0));
                    th.style.width=th.style.minWidth=w+'px';
                    table.querySelectorAll('tbody tr').forEach(function(tr){
                      const td=tr.children[colIdx];
                      if(td) td.style.width=td.style.minWidth=w+'px';
                    });
                  }
                  function up(){
                    document.removeEventListener('mousemove',move);
                    document.removeEventListener('mouseup',up);
                  }
                  document.addEventListener('mousemove',move);
                  document.addEventListener('mouseup',up);
                });
              });
              const bodyEl = block.querySelector('.body');
              if (bodyEl) {
                // Table scroll stays on the table; shell keeps its own scrollbar.
                // Only stopPropagation when the table body can still scroll in that direction.
                bodyEl.addEventListener('wheel', function(ev){
                  // The pointer is inside a virtual table: wheel events belong
                  // to that table only. Never bubble them to xterm, even at the
                  // table's top/bottom edge. Native browser scrolling remains
                  // enabled, including horizontal scrolling and scrollbar behavior.
                  ev.stopPropagation();
                }, {passive:true});
              }
            }

            function cellH(){
              try {
                const d=term._core&&term._core._renderService&&term._core._renderService.dimensions;
                if (d&&d.css&&d.css.cell&&d.css.cell.height) return d.css.cell.height;
              } catch(e){}
              return (host.clientHeight||400)/Math.max(term.rows,1);
            }

            function sync(){
              const list=window._sshdockTbls||[];
              const activeBuffer = term.buffer && term.buffer.active;
              const inAlternateScreen = !!activeBuffer && activeBuffer.type === 'alternate';
              const viewportY=activeBuffer ? activeBuffer.viewportY : 0;
              const ch=cellH();
              const viewH=host.clientHeight||0;
              for (let i=0;i<list.length;i++){
                const b=list[i];
                if (!b||!b.parentNode) continue;
                if (inAlternateScreen) {
                  // Full-screen/TUI applications (nano, vim, less, top, etc.)
                  // own the entire terminal viewport. Never let our HTML table
                  // overlay that application.
                  b.style.display = 'none';
                  continue;
                }
                const markerLine = b._anchorMarker ? b._anchorMarker.line : -1;
                // A marker is only a reflow aid. If xterm disposes it after
                // trimming, keep the last known anchor instead of hiding the
                // whole result table.
                const anchor = markerLine >= 0
                  ? Math.max(0, markerLine - (b._cells|RESERVE))
                  : Math.max(0, b._startAbs|0);
                const start = anchor;
                b._startAbs = start;
                const cells=b._cells|RESERVE;
                const top=(start-viewportY)*ch;
                const height=cells*ch;
                b.style.top=top+'px';
                b.style.height=height+'px';
                b.style.left='0px';
                // Keep HTML result blocks inside the same content width as xterm,
                // leaving the right-side scrollbar gutter completely free.
                b.style.width='calc(100% - 18px)';
                b.style.right='18px';
                // Only visible while its reserved lines intersect the viewport
                b.style.display = (top+height>0 && top<viewH) ? 'flex' : 'none';
              }
            }

            window._sshdockSync = sync;
            if (!term._sshdockScrollBarHook) {
              term._sshdockScrollBarHook = true;
              try {
                term.onScroll(function(){ sync(); reportScrollState(); });
              } catch(e){}
              // xterm.js exposes normal/alternate buffer transitions directly.
              // This is the reliable generic signal for full-screen terminal apps.
              try {
                if (term.buffer && term.buffer.onBufferChange) {
                  term.buffer.onBufferChange(function(){ sync(); });
                }
              } catch(e){}
              // Also sync when xterm re-renders / fits
              try {
                if (term.onRender) term.onRender(function(){ sync(); });
              } catch(e){}
              window.addEventListener('resize', function(){ sync(); });
              if (window.ResizeObserver) {
                try { new ResizeObserver(function(){ sync(); }).observe(host); } catch(e){}
              }
            }
            sync();
            requestAnimationFrame(sync);
            setTimeout(sync, 40);
            setTimeout(sync, 150);
            try { term.focus(); } catch(e){}
          } catch (e) {
            console.error('showTable', e);
          }
        },
        fit: function () {
          try {
            if (fitAddon) {
              fitAddon.fit();
            }
          } catch (e) {}
          try {
            if (window._sshdockSync) {
              window._sshdockSync();
              requestAnimationFrame(window._sshdockSync);
            }
          } catch (e) {}
          reportScrollState();
          reportSize();
        },

        hideTable: function () {
          const blocks = window._sshdockTbls || [];
          for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            if (block && block._anchorMarker) {
              try { block._anchorMarker.dispose(); } catch (e) {}
              block._anchorMarker = null;
            }
            if (block && block.parentNode) block.parentNode.removeChild(block);
          }
          window._sshdockTbls = [];
        },


        find: function (query, options) {
          try {
            if (!term || !query) return false;
            const q = String(query);
            const buffer = term.buffer.active;
            const start = q === lastFindQuery ? lastFindRow + 1 : 0;
            const total = buffer.length;
            for (let pass = 0; pass < 2; pass++) {
              const begin = pass === 0 ? start : 0;
              const end = pass === 0 ? total : Math.min(start, total);
              for (let row = begin; row < end; row++) {
                const line = buffer.getLine(row);
                if (!line) continue;
                const text = line.translateToString(true);
                const col = text.toLowerCase().indexOf(q.toLowerCase());
                if (col >= 0) {
                  lastFindQuery = q;
                  lastFindRow = row;
                  term.scrollToLine(row);
                  if (term.select) term.select(col, row, Math.max(1, q.length));
                  term.focus();
                  return true;
                }
              }
            }
            return false;
          } catch (e) { return false; }
        }
      };

      function bindBridge() {
        if (typeof qt === 'undefined' || !qt.webChannelTransport) {
          // Standalone / fallback
          window.sshdockTerm.ready = true;
          scheduleFit();
          return;
        }
        new QWebChannel(qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge;
          window.sshdockTerm.ready = true;
          scheduleFit();
          flushPendingInput();
          if (bridge && bridge.js_ready) bridge.js_ready();
          reportScrollState();
          // Flush any cwd reported before the bridge was ready
          if (bridge && bridge.report_cwd && window.sshdockReportCwd) {
            try { bridge.report_cwd(window.sshdockReportCwd); } catch (e) {}
          }
        });
      }
// Qt injects qt.webChannelTransport after page load
      if (document.readyState === 'complete') bindBridge();
      else window.addEventListener('load', bindBridge);
      setTimeout(bindBridge, 50);
    })();
  </script>
</body>
</html>
